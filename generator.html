<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Keygen System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#09090b',
                            800: '#18181b',
                            700: '#27272a',
                        },
                        accent: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }

        // Initialize Theme
        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            transition: background-color 0.3s, color 0.3s;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .dark .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: #f4f4f5;
            border: 1px solid #e4e4e7;
            color: #18181b;
            transition: all 0.2s ease;
        }
        .dark .input-field {
            background: rgba(9, 9, 11, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
            background: #ffffff;
        }
        .dark .input-field:focus {
            background: #09090b;
            box-shadow: 0 0 0 1px #3b82f6, 0 0 15px rgba(59, 130, 246, 0.1);
        }
        .input-field:disabled {
            background: #e4e4e7;
            color: #a1a1aa;
            cursor: not-allowed;
        }
        .dark .input-field:disabled {
            background: rgba(39, 39, 42, 0.3);
            color: #71717a;
            border-color: transparent;
        }

        .btn-primary {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }
        
        .sidebar-item {
            transition: all 0.2s ease;
        }
        .sidebar-item:hover {
            background: rgba(0,0,0,0.05);
        }
        .dark .sidebar-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .sidebar-item.active {
            background: rgba(59, 130, 246, 0.1);
            color: #2563eb;
            border-right: 3px solid #3b82f6;
        }
        .dark .sidebar-item.active {
            color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-900 dark:text-gray-100 flex h-screen overflow-hidden selection:bg-accent-500 selection:text-white transition-colors duration-300">

    <!-- Sidebar Placeholder -->
    <div id="layout-sidebar" data-active-page="generator"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen relative z-10">
        <!-- Topbar Placeholder -->
        <div id="layout-topbar" data-title="Workspace / Generator"></div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-100 to-gray-50 dark:from-dark-800 dark:to-dark-900">
            
            <div class="max-w-2xl mx-auto w-full">
                
                <!-- Page Title -->
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between">
                    <h4 class="text-xl font-bold text-gray-900 dark:text-white mb-2 sm:mb-0">License Generator</h4>
                    <nav class="flex" aria-label="Breadcrumb">
                        <ol class="inline-flex items-center space-x-1 md:space-x-3">
                            <li class="inline-flex items-center">
                                <span class="text-sm font-medium text-gray-500 dark:text-zinc-400">Tools</span>
                            </li>
                            <li>
                                <div class="flex items-center">
                                    <svg class="w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/></svg>
                                    <span class="text-sm font-medium text-gray-700 dark:text-zinc-200 ml-1 md:ml-2">Generator</span>
                                </div>
                            </li>
                        </ol>
                    </nav>
                </div>

                <!-- Generator Panel -->
                <div class="glass-panel rounded-2xl p-6 sm:p-10 animate-slide-up relative">
                    
                    <div class="mb-8 border-b border-gray-200 dark:border-white/10 pb-6">
                        <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white mb-1">
                            Generate License
                        </h1>
                        <p class="text-gray-500 dark:text-zinc-400 text-sm">Create secure activation keys for Laser Marking System.</p>
                    </div>

                    <div class="flex p-1 bg-gray-100 dark:bg-dark-900 rounded-lg mb-8 border border-gray-200 dark:border-white/5">
                        <button id="modePasskey" onclick="setMode('passkey')" class="flex-1 py-2 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 bg-white dark:bg-zinc-800 text-gray-900 dark:text-white shadow-sm border border-gray-200 dark:border-white/10">
                            Passkey Decrypt
                        </button>
                        <button id="modeManual" onclick="setMode('manual')" class="flex-1 py-2 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 text-gray-500 hover:text-gray-700 dark:text-zinc-500 dark:hover:text-zinc-300">
                            Manual Override
                        </button>
                    </div>

                    <div class="space-y-5">
                        <div id="groupPasskey" class="transition-all duration-300">
                            <label class="block text-xs font-semibold text-gray-600 dark:text-zinc-400 uppercase tracking-wide mb-2">Encrypted Payload (Passkey)</label>
                            <textarea id="passkeyInput" rows="3" class="input-field w-full rounded-lg p-3 text-sm font-mono resize-none" placeholder="Paste hexadecimal passkey here..."></textarea>
                        </div>

                        <div id="groupManual" class="hidden transition-all duration-300">
                            <label class="block text-xs font-semibold text-gray-600 dark:text-zinc-400 uppercase tracking-wide mb-2">Target Motherboard Serial</label>
                            <input type="text" id="mbInput" class="input-field w-full rounded-lg p-3 text-sm font-mono" placeholder="e.g. LR0BNTXS">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 dark:text-zinc-400 uppercase tracking-wide mb-2">License Expiration</label>
                            <input type="text" id="dateInput" value="2099/12/31" disabled class="input-field w-full rounded-lg p-3 text-sm font-mono">
                        </div>

                        <button id="btnGenerate" onclick="generate()" class="btn-primary w-full bg-accent-600 text-white font-medium text-sm py-3 px-6 rounded-lg tracking-wide flex items-center justify-center gap-2 mt-8 shadow-md shadow-accent-500/20">
                            <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            <span id="btnText">Generate Activation Key</span>
                        </button>
                    </div>

                    <div id="result" class="hidden mt-8 animate-fade-in">
                        <div class="bg-gray-50 dark:bg-dark-900/50 rounded-xl overflow-hidden border border-gray-200 dark:border-white/5 shadow-inner">
                            <div class="p-4 border-b border-gray-200 dark:border-white/5 flex justify-between items-center">
                                <span class="text-xs text-gray-500 dark:text-zinc-500 font-semibold uppercase tracking-wide">Hardware ID</span>
                                <span id="displayMb" class="text-sm font-mono text-gray-800 dark:text-zinc-200 font-bold">-</span>
                            </div>
                            <div class="p-4 border-b border-gray-200 dark:border-white/5 flex justify-between items-center">
                                <span class="text-xs text-gray-500 dark:text-zinc-500 font-semibold uppercase tracking-wide">Valid Until</span>
                                <span id="displayDate" class="text-sm font-mono text-gray-800 dark:text-zinc-200 font-bold">-</span>
                            </div>
                            <div class="p-5">
                                <span class="text-xs text-gray-500 dark:text-zinc-500 font-semibold uppercase tracking-wide block mb-3">Generated Serial Data</span>
                                <div id="displayPasskey" class="text-xs font-mono text-gray-700 dark:text-zinc-400 break-all bg-white dark:bg-dark-900 p-4 rounded-lg border border-gray-200 dark:border-white/5 shadow-sm">
                                    -
                                </div>
                            </div>
                        </div>

                        <div id="errorStatus" class="hidden mt-6 p-4 bg-red-100 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-400 text-sm font-medium rounded-lg text-center"></div>
                        <div id="matchStatus" class="hidden mt-5 text-center text-xs font-semibold text-accent-600 dark:text-accent-500 tracking-wide uppercase"></div>
                        
                        <a id="downloadBtn" class="hidden mt-6 w-full bg-white dark:bg-white/5 hover:bg-gray-50 dark:hover:bg-white/10 border border-gray-200 dark:border-white/10 text-gray-700 dark:text-zinc-300 font-medium rounded-lg py-3 transition-colors duration-200 text-sm text-center flex items-center justify-center gap-2 shadow-sm">
                            <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            <span>Download serial.dat</span>
                        </a>
                    </div>
                </div>

                <!-- Footer Placeholder -->
                <div id="layout-footer"></div>
            </div>
        </div>
    </main>

    <script src="assets/js/layout.js"></script>
    <script>

        let currentMode = 'passkey';

        function setMode(mode) {
            currentMode = mode;
            const btnPasskey = document.getElementById('modePasskey');
            const btnManual = document.getElementById('modeManual');
            
            const activeClass = 'flex-1 py-2 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 bg-white dark:bg-zinc-800 text-gray-900 dark:text-white shadow-sm border border-gray-200 dark:border-white/10';
            const inactiveClass = 'flex-1 py-2 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 text-gray-500 hover:text-gray-700 dark:text-zinc-500 dark:hover:text-zinc-300 border border-transparent';

            if (mode === 'passkey') {
                btnPasskey.className = activeClass;
                btnManual.className = inactiveClass;
                document.getElementById('groupPasskey').classList.remove('hidden');
                document.getElementById('groupManual').classList.add('hidden');
            } else {
                btnManual.className = activeClass;
                btnPasskey.className = inactiveClass;
                document.getElementById('groupManual').classList.remove('hidden');
                document.getElementById('groupPasskey').classList.add('hidden');
            }
            document.getElementById('result').classList.add('hidden');
        }

        async function generate() {
            const btn = document.getElementById('btnGenerate');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('errorStatus');
            const statusDiv = document.getElementById('matchStatus');
            const downloadBtn = document.getElementById('downloadBtn');

            errorDiv.classList.add('hidden');
            statusDiv.classList.add('hidden');
            resultDiv.classList.add('hidden');
            downloadBtn.classList.add('hidden');

            const payload = {};
            const date = document.getElementById('dateInput').value.trim();
            payload.date = date;

            if (currentMode === 'passkey') {
                const passkey = document.getElementById('passkeyInput').value.trim().toUpperCase();
                if (!passkey) {
                    showError('Input Required: Please provide the Passkey payload.');
                    return;
                }
                payload.passkey = passkey;
            } else {
                const mb = document.getElementById('mbInput').value.trim();
                if (!mb) {
                    showError('Input Required: Motherboard Serial is required.');
                    return;
                }
                payload.mb = mb;
            }

            btn.disabled = true;
            btnSpinner.classList.remove('hidden');
            btnText.textContent = 'Processing Request...';

            try {
                const infoResponse = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const info = await infoResponse.json();
                if (info.error) throw new Error(info.error);

                // Use plain text for the hex string
                const blob = new Blob([info.passkey_hex], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);

                document.getElementById('displayMb').textContent = info.mb;
                document.getElementById('displayDate').textContent = info.date;
                document.getElementById('displayPasskey').textContent = info.passkey_hex;
                
                statusDiv.textContent = 'Activation key generated successfully';
                statusDiv.classList.remove('hidden');
                resultDiv.classList.remove('hidden');

                downloadBtn.href = url;
                downloadBtn.download = 'serial.dat';
                downloadBtn.classList.remove('hidden');
                downloadBtn.classList.add('flex');

            } catch (e) {
                showError('Operation Failed: ' + e.message);
            } finally {
                btn.disabled = false;
                btnSpinner.classList.add('hidden');
                btnText.textContent = 'Generate Activation Key';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorStatus');
            const resultDiv = document.getElementById('result');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
