<!-- Topbar -->
<header class="h-16 bg-white/80 dark:bg-dark-800/80 backdrop-blur-md border-b border-gray-200 dark:border-white/10 flex items-center justify-between px-4 sm:px-6 z-20">
    <div class="flex items-center gap-4">
        <button class="md:hidden p-2 rounded-md text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h2 id="topbar-title" class="text-sm font-medium text-gray-700 dark:text-gray-300">Workspace / Generator</h2>
    </div>
    
    <div class="flex items-center gap-2">
        <!-- Theme Toggle -->
        <button onclick="window.toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/5 text-gray-500 dark:text-gray-400 transition-colors">

            <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
    </div>
</header>
