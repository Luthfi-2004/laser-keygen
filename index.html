<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Keygen System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#09090b',
                            800: '#18181b',
                            700: '#27272a',
                        },
                        accent: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #09090b; 
            color: #fafafa;
            background-image: radial-gradient(circle at 50% 0%, #1e1e24 0%, transparent 50%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background: rgba(9, 9, 11, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6, 0 0 15px rgba(59, 130, 246, 0.1);
            background: #09090b;
        }
        .input-field:disabled {
            background: rgba(39, 39, 42, 0.3);
            color: #71717a;
            cursor: not-allowed;
            border-color: transparent;
        }
        .btn-primary {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            transition: all 0.5s ease;
        }
        .btn-primary:hover::after {
            left: 150%;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }
        .glass-result {
            background: linear-gradient(145deg, rgba(39, 39, 42, 0.4), rgba(24, 24, 27, 0.4));
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-accent-500 selection:text-white">
    
    <div class="panel w-full max-w-xl rounded-2xl p-8 md:p-10 relative overflow-hidden animate-slide-up">
        
        <!-- Decorative Glow -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-32 bg-accent-500 rounded-full blur-[80px] opacity-20 pointer-events-none animate-pulse-slow"></div>

        <div class="relative z-10">
            <div class="mb-10 text-center md:text-left border-b border-white/10 pb-6">
                <h1 class="text-2xl md:text-3xl font-semibold tracking-tight text-white mb-2">
                    License System
                </h1>
                <p class="text-zinc-400 text-sm font-medium tracking-wide">SECURE KEY GENERATION PLATFORM</p>
            </div>

            <div class="flex p-1 bg-dark-900 rounded-lg mb-8 border border-white/5">
                <button id="modePasskey" onclick="setMode('passkey')" class="flex-1 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 bg-zinc-800 text-white shadow-sm border border-white/10">
                    PASSKEY DECRYPT
                </button>
                <button id="modeManual" onclick="setMode('manual')" class="flex-1 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 text-zinc-500 hover:text-zinc-300">
                    MANUAL OVERRIDE
                </button>
            </div>

            <div class="space-y-6">
                <div id="groupPasskey" class="transition-all duration-300">
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2">Encrypted Payload (Passkey)</label>
                    <textarea id="passkeyInput" rows="3" class="input-field w-full rounded-lg p-3 text-sm font-mono resize-none" placeholder="Paste hexadecimal passkey here..."></textarea>
                </div>

                <div id="groupManual" class="hidden transition-all duration-300">
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2">Target Motherboard Serial</label>
                    <input type="text" id="mbInput" class="input-field w-full rounded-lg p-3 text-sm font-mono" placeholder="e.g. LR0BNTXS">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2">License Expiration</label>
                    <input type="text" id="dateInput" value="2099/12/31" disabled class="input-field w-full rounded-lg p-3 text-sm font-mono">
                </div>

                <button id="btnGenerate" onclick="generate()" class="btn-primary w-full bg-accent-600 text-white font-medium text-sm py-3.5 px-6 rounded-lg tracking-wide flex items-center justify-center gap-2 mt-8">
                    <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="btnText">GENERATE LICENSE</span>
                </button>
            </div>

            <div id="result" class="hidden mt-8 animate-fade-in">
                <div class="glass-result rounded-xl overflow-hidden shadow-inner">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/[0.02]">
                        <span class="text-[11px] text-zinc-500 font-semibold uppercase tracking-widest">Hardware ID</span>
                        <span id="displayMb" class="text-sm font-mono text-zinc-200 font-medium">-</span>
                    </div>
                    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/[0.01]">
                        <span class="text-[11px] text-zinc-500 font-semibold uppercase tracking-widest">Valid Until</span>
                        <span id="displayDate" class="text-sm font-mono text-zinc-200 font-medium">-</span>
                    </div>
                    <div class="p-5">
                        <span class="text-[11px] text-zinc-500 font-semibold uppercase tracking-widest block mb-3">Generated Serial (DAT)</span>
                        <div id="displayPasskey" class="text-xs font-mono text-zinc-400 break-all bg-dark-900 p-4 rounded-lg border border-white/5">
                            -
                        </div>
                    </div>
                </div>

                <div id="errorStatus" class="hidden mt-6 p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-sm font-medium rounded-lg text-center"></div>
                <div id="matchStatus" class="hidden mt-5 text-center text-xs font-semibold text-accent-500 tracking-widest uppercase"></div>
                
                <a id="downloadBtn" class="hidden mt-6 w-full bg-white/5 hover:bg-white/10 border border-white/10 text-zinc-300 hover:text-white font-medium rounded-lg py-3 transition-colors duration-200 text-sm text-center flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Download serial.dat</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'passkey';

        function setMode(mode) {
            currentMode = mode;
            const btnPasskey = document.getElementById('modePasskey');
            const btnManual = document.getElementById('modeManual');
            
            const activeClass = 'flex-1 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 bg-zinc-800 text-white shadow-sm border border-white/10';
            const inactiveClass = 'flex-1 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-md transition-all duration-300 text-zinc-500 hover:text-zinc-300';

            if (mode === 'passkey') {
                btnPasskey.className = activeClass;
                btnManual.className = inactiveClass;
                document.getElementById('groupPasskey').classList.remove('hidden');
                document.getElementById('groupManual').classList.add('hidden');
            } else {
                btnManual.className = activeClass;
                btnPasskey.className = inactiveClass;
                document.getElementById('groupManual').classList.remove('hidden');
                document.getElementById('groupPasskey').classList.add('hidden');
            }
            document.getElementById('result').classList.add('hidden');
        }

        function hexToBytes(hex) {
            let bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
            }
            return bytes;
        }

        async function generate() {
            const btn = document.getElementById('btnGenerate');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('errorStatus');
            const statusDiv = document.getElementById('matchStatus');
            const downloadBtn = document.getElementById('downloadBtn');

            errorDiv.classList.add('hidden');
            statusDiv.classList.add('hidden');
            resultDiv.classList.add('hidden');
            downloadBtn.classList.add('hidden');

            const payload = {};
            const date = document.getElementById('dateInput').value.trim();
            payload.date = date;

            if (currentMode === 'passkey') {
                const passkey = document.getElementById('passkeyInput').value.trim().toUpperCase();
                if (!passkey) {
                    showError('Input Required: Please provide the Passkey payload.');
                    return;
                }
                payload.passkey = passkey;
            } else {
                const mb = document.getElementById('mbInput').value.trim();
                if (!mb) {
                    showError('Input Required: Motherboard Serial is required.');
                    return;
                }
                payload.mb = mb;
            }

            btn.disabled = true;
            btnSpinner.classList.remove('hidden');
            btnText.textContent = 'PROCESSING';

            try {
                const infoResponse = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const info = await infoResponse.json();
                if (info.error) throw new Error(info.error);

                const blob = new Blob([info.passkey_hex], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);

                document.getElementById('displayMb').textContent = info.mb;
                document.getElementById('displayDate').textContent = info.date;
                document.getElementById('displayPasskey').textContent = info.passkey_hex;
                
                statusDiv.textContent = 'License generation completed';
                statusDiv.classList.remove('hidden');
                resultDiv.classList.remove('hidden');

                downloadBtn.href = url;
                downloadBtn.download = 'serial.dat';
                downloadBtn.classList.remove('hidden');
                downloadBtn.classList.add('flex');

                fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mb: info.mb,
                        passkey_hex: info.passkey_hex,
                        date: info.date
                    })
                }).catch(e => console.warn('Sync failed:', e));

            } catch (e) {
                showError('Operation Failed: ' + e.message);
            } finally {
                btn.disabled = false;
                btnSpinner.classList.add('hidden');
                btnText.textContent = 'GENERATE LICENSE';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorStatus');
            const resultDiv = document.getElementById('result');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
