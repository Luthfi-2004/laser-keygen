<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Keygen [UNDERGROUND]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['Fira Code', 'Courier New', 'monospace'],
                    },
                    colors: {
                        brand: {
                            500: '#ff0000',
                            600: '#cc0000',
                            900: '#330000',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #050505; color: #ff3333; }
        .glass-panel {
            background: rgba(10, 0, 0, 0.8);
            border: 1px solid #550000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2), inset 0 0 20px rgba(255, 0, 0, 0.05);
        }
        .input-glass {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #550000;
            color: #ff5555;
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .input-glass:disabled {
            background: rgba(30, 0, 0, 0.5);
            color: #883333;
            cursor: not-allowed;
            border-color: #330000;
        }
        .glitch-text {
            text-shadow: 2px 0 red, -2px 0 blue;
            animation: glitch 1s infinite alternate;
        }
        @keyframes glitch {
            0% { text-shadow: 2px 0 red, -2px 0 blue; }
            20% { text-shadow: -2px 0 red, 2px 0 blue; }
            40% { text-shadow: 2px 0 red, -2px 0 blue; }
            60% { text-shadow: -2px 0 red, 2px 0 blue; }
            80% { text-shadow: 2px 0 red, -2px 0 blue; }
            100% { text-shadow: -2px 0 red, 2px 0 blue; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #550000; }
        ::-webkit-scrollbar-thumb:hover { background: #ff0000; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-brand-500 selection:text-white bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
    <div class="glass-panel w-full max-w-2xl rounded-lg p-8 md:p-10 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-red-600 to-transparent opacity-50"></div>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-red-600 mb-2 glitch-text uppercase tracking-widest">
                    LASER_KEYGEN // ROOT
                </h1>
                <p class="text-red-900 text-sm font-medium tracking-wide uppercase">UNAUTHORIZED ACCESS RESTRICTED</p>
            </div>

            <div class="flex p-1 bg-black/80 rounded mb-8 border border-red-900/50">
                <button id="modePasskey" onclick="setMode('passkey')" class="flex-1 py-2 text-sm font-bold rounded-sm transition-all duration-300 bg-red-800 text-black shadow-[0_0_15px_rgba(255,0,0,0.4)]">
                    [ PASSKEY_DECRYPT ]
                </button>
                <button id="modeManual" onclick="setMode('manual')" class="flex-1 py-2 text-sm font-bold rounded-sm transition-all duration-300 text-red-900 hover:text-red-500">
                    [ MANUAL_OVERRIDE ]
                </button>
            </div>

            <div class="space-y-6">
                <div id="groupPasskey" class="transition-all duration-300">
                    <label class="block text-xs font-bold text-red-700 uppercase tracking-wider mb-2">> INJECT_PASSKEY_PAYLOAD</label>
                    <textarea id="passkeyInput" rows="3" class="input-glass w-full p-4 text-sm resize-none" placeholder="AWAITING HEX DUMP..."></textarea>
                </div>

                <div id="groupManual" class="hidden transition-all duration-300">
                    <label class="block text-xs font-bold text-red-700 uppercase tracking-wider mb-2">> TARGET_MOTHERBOARD_ID</label>
                    <input type="text" id="mbInput" class="input-glass w-full p-4 text-sm" placeholder="e.g. LR0BNTXS">
                </div>

                <div>
                    <label class="block text-xs font-bold text-red-700 uppercase tracking-wider mb-2">> FORCED_EXPIRATION_DATE (LOCKED)</label>
                    <input type="text" id="dateInput" value="2099/12/31" disabled class="input-glass w-full p-4 text-sm">
                </div>

                <button id="btnGenerate" onclick="generate()" class="w-full bg-red-900 hover:bg-red-700 text-black hover:text-white font-bold py-4 px-6 border border-red-600 hover:border-red-400 rounded-sm uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 mt-8 shadow-[0_0_10px_rgba(255,0,0,0.2)] hover:shadow-[0_0_20px_rgba(255,0,0,0.6)]">
                    <svg id="btnSpinner" class="hidden w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="btnText">> EXECUTE_EXPLOIT</span>
                </button>
            </div>

            <div id="result" class="hidden mt-8">
                <div class="bg-black/90 border border-red-800 p-1">
                    <div class="p-3 border-b border-red-900/50 flex justify-between items-center bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,rgba(255,0,0,0.05)_10px,rgba(255,0,0,0.05)_20px)]">
                        <span class="text-xs text-red-700 font-bold uppercase tracking-wider">> TARGET_MB</span>
                        <span id="displayMb" class="text-sm font-mono text-red-500 font-bold">-</span>
                    </div>
                    <div class="p-3 border-b border-red-900/50 flex justify-between items-center bg-[repeating-linear-gradient(-45deg,transparent,transparent_10px,rgba(255,0,0,0.05)_10px,rgba(255,0,0,0.05)_20px)]">
                        <span class="text-xs text-red-700 font-bold uppercase tracking-wider">> VALID_UNTIL</span>
                        <span id="displayDate" class="text-sm font-mono text-red-500 font-bold">-</span>
                    </div>
                    <div class="p-4 bg-black">
                        <span class="text-xs text-red-700 font-bold uppercase tracking-wider block mb-2">> SERIAL_DUMP [HEX]</span>
                        <div id="displayPasskey" class="text-xs font-mono text-red-400 break-all bg-gray-950 p-4 border border-red-900/30">
                            -
                        </div>
                    </div>
                </div>

                <div id="errorStatus" class="hidden mt-4 p-4 bg-red-950 border border-red-600 text-red-400 text-sm font-bold text-center"></div>
                <div id="matchStatus" class="hidden mt-4 text-center text-sm font-bold text-red-500 uppercase tracking-widest glitch-text"></div>
                
                <a id="downloadBtn" class="hidden mt-4 w-full bg-black hover:bg-red-950 border border-red-700 hover:border-red-500 text-red-600 hover:text-red-400 font-bold py-3.5 transition-all duration-300 text-center flex items-center justify-center gap-2 shadow-[inset_0_0_10px_rgba(255,0,0,0.2)] hover:shadow-[inset_0_0_20px_rgba(255,0,0,0.4)]">
                    <span>[ DOWNLOAD_SERIAL.DAT ]</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'passkey';

        function setMode(mode) {
            currentMode = mode;
            const btnPasskey = document.getElementById('modePasskey');
            const btnManual = document.getElementById('modeManual');
            
            if (mode === 'passkey') {
                btnPasskey.className = 'flex-1 py-2 text-sm font-bold rounded-sm transition-all duration-300 bg-red-800 text-black shadow-[0_0_15px_rgba(255,0,0,0.4)]';
                btnManual.className = 'flex-1 py-2 text-sm font-bold rounded-sm transition-all duration-300 text-red-900 hover:text-red-500';
                document.getElementById('groupPasskey').classList.remove('hidden');
                document.getElementById('groupManual').classList.add('hidden');
            } else {
                btnManual.className = 'flex-1 py-2 text-sm font-bold rounded-sm transition-all duration-300 bg-red-800 text-black shadow-[0_0_15px_rgba(255,0,0,0.4)]';
                btnPasskey.className = 'flex-1 py-2 text-sm font-bold rounded-sm transition-all duration-300 text-red-900 hover:text-red-500';
                document.getElementById('groupManual').classList.remove('hidden');
                document.getElementById('groupPasskey').classList.add('hidden');
            }
            document.getElementById('result').classList.add('hidden');
        }

        function hexToBytes(hex) {
            let bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
            }
            return bytes;
        }

        async function generate() {
            const btn = document.getElementById('btnGenerate');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('errorStatus');
            const statusDiv = document.getElementById('matchStatus');
            const downloadBtn = document.getElementById('downloadBtn');

            errorDiv.classList.add('hidden');
            statusDiv.classList.add('hidden');
            resultDiv.classList.add('hidden');
            downloadBtn.classList.add('hidden');

            const payload = {};
            const date = document.getElementById('dateInput').value.trim();
            payload.date = date;

            if (currentMode === 'passkey') {
                const passkey = document.getElementById('passkeyInput').value.trim().toUpperCase();
                if (!passkey) {
                    showError('FATAL: PASSKEY_PAYLOAD_MISSING');
                    return;
                }
                payload.passkey = passkey;
            } else {
                const mb = document.getElementById('mbInput').value.trim();
                if (!mb) {
                    showError('FATAL: TARGET_MB_UNDEFINED');
                    return;
                }
                payload.mb = mb;
            }

            btn.disabled = true;
            btnSpinner.classList.remove('hidden');
            btnText.textContent = '> COMPILING...';

            try {
                const infoResponse = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const info = await infoResponse.json();
                if (info.error) throw new Error(info.error);

                const byteArray = hexToBytes(info.passkey_hex);
                const blob = new Blob([byteArray], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);

                document.getElementById('displayMb').textContent = info.mb;
                document.getElementById('displayDate').textContent = info.date;
                document.getElementById('displayPasskey').textContent = info.passkey_hex;
                
                statusDiv.textContent = 'SYSTEM_COMPROMISED // LICENSE_GENERATED';
                statusDiv.classList.remove('hidden');
                resultDiv.classList.remove('hidden');

                downloadBtn.href = url;
                downloadBtn.download = 'serial.dat';
                downloadBtn.classList.remove('hidden');
                downloadBtn.classList.add('flex');

                fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mb: info.mb,
                        passkey_hex: info.passkey_hex,
                        date: info.date
                    })
                }).catch(e => console.warn('TRACE_FAILED:', e));

            } catch (e) {
                showError('ERROR: ' + e.message);
            } finally {
                btn.disabled = false;
                btnSpinner.classList.add('hidden');
                btnText.textContent = '> EXECUTE_EXPLOIT';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorStatus');
            const resultDiv = document.getElementById('result');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
