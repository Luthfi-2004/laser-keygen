<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Keygen Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'gradient-x': 'gradient-x 3s ease infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.8);
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="animated-bg text-slate-200 min-h-screen flex items-center justify-center p-4 selection:bg-brand-500 selection:text-white">
    <div class="glass-panel w-full max-w-2xl rounded-3xl p-8 md:p-10 shadow-2xl relative overflow-hidden">
        
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-brand-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400 mb-2">
                    Laser Keygen
                </h1>
                <p class="text-slate-400 text-sm font-medium tracking-wide uppercase">Premium License Generator</p>
            </div>

            <div class="flex p-1 bg-slate-800/50 rounded-xl mb-8 border border-slate-700/50">
                <button id="modePasskey" onclick="setMode('passkey')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 bg-brand-500 text-white shadow-lg shadow-brand-500/20">
                    🔑 From PASSKEY
                </button>
                <button id="modeManual" onclick="setMode('manual')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50">
                    🖥️ Manual (MB)
                </button>
            </div>

            <div class="space-y-6">
                <div id="groupPasskey" class="transition-all duration-300">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Encrypted PASSKEY</label>
                    <textarea id="passkeyInput" rows="3" class="input-glass w-full rounded-xl p-4 text-slate-200 font-mono text-sm outline-none resize-none placeholder-slate-600" placeholder="e.g. 3FADFC599A071FE6CD3C8F..."></textarea>
                </div>

                <div id="groupManual" class="hidden transition-all duration-300">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Motherboard Serial</label>
                    <input type="text" id="mbInput" class="input-glass w-full rounded-xl p-4 text-slate-200 font-mono text-sm outline-none placeholder-slate-600" placeholder="e.g. LR0BNTXS">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Expiry Date</label>
                    <input type="text" id="dateInput" value="2099/12/31" class="input-glass w-full rounded-xl p-4 text-slate-200 font-mono text-sm outline-none placeholder-slate-600">
                </div>

                <button id="btnGenerate" onclick="generate()" class="relative w-full group overflow-hidden rounded-xl p-[1px] mt-8">
                    <span class="absolute inset-0 bg-gradient-to-r from-brand-500 via-indigo-500 to-brand-500 rounded-xl opacity-70 group-hover:opacity-100 transition-opacity duration-300 animate-gradient-x"></span>
                    <div class="relative bg-slate-900/50 backdrop-blur-sm rounded-xl px-4 py-4 transition-all duration-300 group-hover:bg-slate-900/30 flex items-center justify-center gap-2">
                        <svg id="btnIcon" class="w-5 h-5 text-brand-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <svg id="btnSpinner" class="hidden w-5 h-5 text-white animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <span id="btnText" class="font-semibold text-slate-200 group-hover:text-white transition-colors">Generate License</span>
                    </div>
                </button>
            </div>

            <div id="result" class="hidden mt-8">
                <div class="bg-slate-900/50 border border-slate-700/50 rounded-xl overflow-hidden backdrop-blur-md">
                    <div class="p-4 border-b border-slate-700/50 flex justify-between items-center">
                        <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Target Motherboard</span>
                        <span id="displayMb" class="text-sm font-mono text-brand-400 font-medium">-</span>
                    </div>
                    <div class="p-4 border-b border-slate-700/50 flex justify-between items-center">
                        <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Valid Until</span>
                        <span id="displayDate" class="text-sm font-mono text-emerald-400 font-medium">-</span>
                    </div>
                    <div class="p-4">
                        <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider block mb-2">Generated Serial (Hex)</span>
                        <div id="displayPasskey" class="text-xs font-mono text-slate-300 break-all bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                            -
                        </div>
                    </div>
                </div>

                <div id="errorStatus" class="hidden mt-4 p-4 rounded-xl bg-red-900/20 border border-red-900/50 text-red-400 text-sm font-medium text-center"></div>
                <div id="matchStatus" class="hidden mt-4 text-center text-sm font-medium text-emerald-400"></div>
                
                <a id="downloadBtn" class="hidden mt-4 w-full bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 hover:text-emerald-300 font-semibold rounded-xl py-3.5 transition-all duration-300 text-center flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Download serial.dat</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'passkey';

        function setMode(mode) {
            currentMode = mode;
            const btnPasskey = document.getElementById('modePasskey');
            const btnManual = document.getElementById('modeManual');
            
            if (mode === 'passkey') {
                btnPasskey.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 bg-brand-500 text-white shadow-lg shadow-brand-500/20';
                btnManual.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50';
                document.getElementById('groupPasskey').classList.remove('hidden');
                document.getElementById('groupManual').classList.add('hidden');
            } else {
                btnManual.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 bg-brand-500 text-white shadow-lg shadow-brand-500/20';
                btnPasskey.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all duration-300 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50';
                document.getElementById('groupManual').classList.remove('hidden');
                document.getElementById('groupPasskey').classList.add('hidden');
            }
            document.getElementById('result').classList.add('hidden');
        }

        function hexToBytes(hex) {
            let bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
            }
            return bytes;
        }

        async function generate() {
            const btn = document.getElementById('btnGenerate');
            const btnIcon = document.getElementById('btnIcon');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('errorStatus');
            const statusDiv = document.getElementById('matchStatus');
            const downloadBtn = document.getElementById('downloadBtn');

            errorDiv.classList.add('hidden');
            statusDiv.classList.add('hidden');
            resultDiv.classList.add('hidden');
            downloadBtn.classList.add('hidden');

            const payload = {};
            const date = document.getElementById('dateInput').value.trim();
            if (!date.match(/^\d{4}\/\d{2}\/\d{2}$/)) {
                showError('Invalid date format. Use YYYY/MM/DD');
                return;
            }
            payload.date = date;

            if (currentMode === 'passkey') {
                const passkey = document.getElementById('passkeyInput').value.trim().toUpperCase();
                if (!passkey) {
                    showError('Please paste the PASSKEY first.');
                    return;
                }
                payload.passkey = passkey;
            } else {
                const mb = document.getElementById('mbInput').value.trim();
                if (!mb) {
                    showError('Motherboard Serial cannot be empty.');
                    return;
                }
                payload.mb = mb;
            }

            btn.disabled = true;
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            btnText.textContent = 'Processing...';

            try {
                // 1. Ambil info dari /api/generate
                const infoResponse = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const info = await infoResponse.json();
                if (info.error) throw new Error(info.error);

                // 2. CONVERT HEX TO BINARY BLOB (Fix for Vercel corrupting binary responses)
                const byteArray = hexToBytes(info.passkey_hex);
                const blob = new Blob([byteArray], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);

                // Show success results
                document.getElementById('displayMb').textContent = info.mb;
                document.getElementById('displayDate').textContent = info.date;
                document.getElementById('displayPasskey').textContent = info.passkey_hex;
                
                statusDiv.textContent = 'License generated successfully!';
                statusDiv.classList.remove('hidden');
                resultDiv.classList.remove('hidden');

                downloadBtn.href = url;
                downloadBtn.download = 'serial.dat';
                downloadBtn.innerHTML = <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download serial.dat ( bytes);
                downloadBtn.classList.remove('hidden');
                downloadBtn.classList.add('flex');

                // 3. Background Save
                fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mb: info.mb,
                        passkey_hex: info.passkey_hex,
                        date: info.date
                    })
                }).catch(e => console.warn('Supabase save error:', e));

            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
                btnText.textContent = 'Generate License';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorStatus');
            const resultDiv = document.getElementById('result');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
