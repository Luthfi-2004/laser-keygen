<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Keygen - History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#09090b',
                            800: '#18181b',
                            700: '#27272a',
                        },
                        accent: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }

        // Initialize Theme
        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(0,0,0,0.05); }
        .dark .sidebar-item:hover { background: rgba(255,255,255,0.05); }
        .sidebar-item.active { background: rgba(59, 130, 246, 0.1); color: #2563eb; border-right: 3px solid #3b82f6; }
        .dark .sidebar-item.active { color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-900 dark:text-gray-100 flex h-screen overflow-hidden selection:bg-accent-500 selection:text-white transition-colors duration-300">

    <!-- Sidebar Placeholder -->
    <div id="layout-sidebar" data-active-page="history"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen relative z-10">
        <!-- Topbar Placeholder -->
        <div id="layout-topbar" data-title="Activation History"></div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-100 to-gray-50 dark:from-dark-800 dark:to-dark-900">
            
            <div class="max-w-4xl mx-auto w-full">
                <!-- Data Table Panel -->
                <div class="bg-white/80 dark:bg-dark-800/80 backdrop-blur-md rounded-2xl p-6 border border-gray-200 dark:border-white/10 shadow-lg">
                    
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white mb-1">
                            Activation Logs
                        </h1>
                        <p class="text-gray-500 dark:text-zinc-400 text-sm">View history of generated licenses.</p>
                    </div>

                    <!-- Placeholder for the Data Table -->
                    <div class="p-8 text-center border-2 border-dashed border-gray-300 dark:border-zinc-700 rounded-xl text-gray-400 dark:text-zinc-500 text-sm">
                        [ Database Table will appear here ]
                    </div>

                </div>

                <!-- Footer Placeholder -->
                <div id="layout-footer"></div>
            </div>
        </div>
    </main>

    <script src="assets/js/layout.js"></script>
</body>
</html>
