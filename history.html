<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Keygen - History</title>
    <link rel="icon" type="image/png" href="/logoIGP-QE.png">
    <script src="assets/vendor/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#09090b',
                            800: '#18181b',
                            700: '#27272a',
                        },
                        accent: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }

        // Initialize Theme
        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link href="assets/vendor/fonts.css" rel="stylesheet">
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(0,0,0,0.05); }
        .dark .sidebar-item:hover { background: rgba(255,255,255,0.05); }
        .sidebar-item.active { background: rgba(59, 130, 246, 0.1); color: #2563eb; border-right: 3px solid #3b82f6; }
        .dark .sidebar-item.active { color: #3b82f6; }
    </style>
<link href="assets/vendor/simple-datatables.css" rel="stylesheet" type="text/css"><script src="assets/vendor/simple-datatables.js" type="text/javascript"></script></head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-900 dark:text-gray-100 flex h-screen overflow-hidden selection:bg-accent-500 selection:text-white transition-colors duration-300">

    <!-- Sidebar Placeholder -->
    <div id="layout-sidebar" data-active-page="history"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen relative z-10">
        <style>
            /* DataTables Custom Overrides */
            .datatable-wrapper { font-family: 'Inter', sans-serif; }
            .datatable-top, .datatable-bottom { padding: 1rem 0; }
            
            .datatable-selector, .datatable-input { 
                background-color: #fff !important; 
                border: 1px solid #e5e7eb !important; 
                border-radius: 0.5rem; 
                padding: 0.35rem 0.75rem;
                outline: none;
                color: inherit !important;
            }
            .dark .datatable-selector, .dark .datatable-input { 
                border-color: rgba(255,255,255,0.1) !important; 
                background-color: #18181b !important;
                color: #e4e4e7 !important;
            }
            
            /* Fix Sort Arrows in Dark Mode */
            .dark .datatable-sorter::before { border-top-color: #a1a1aa !important; opacity: 0.6; }
            .dark .datatable-sorter::after { border-bottom-color: #a1a1aa !important; opacity: 0.6; }
            
            /* Center Headers */
            #historyTable th:not(:last-child) { text-align: center !important; }
            #historyTable th:last-child { text-align: justify !important; }
            
            #historyTable th:not(:last-child) .datatable-sorter {
                display: flex;
                justify-content: center;
                align-items: center;
                padding-right: 1.5rem !important; /* space for sort arrows */
            }
            #historyTable th:last-child .datatable-sorter {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                padding-right: 1.5rem !important; /* space for sort arrows */
            }
            .datatable-sorter::before, .datatable-sorter::after {
                right: 8px !important;
            }
            
            /* Fix Pagination */
            .datatable-pagination a {
                border: 1px solid transparent;
                border-radius: 0.375rem;
                cursor: pointer;
                padding: 0.35rem 0.75rem;
                transition: all 0.2s;
                color: inherit !important;
            }
            .datatable-pagination a:hover { background-color: rgba(0,0,0,0.05); }
            .dark .datatable-pagination a:hover { background-color: rgba(255,255,255,0.1); }
            .datatable-pagination .active a, .datatable-pagination .active a:hover {
                background-color: #3b82f6 !important;
                color: white !important;
            }
            .dark .datatable-info { color: #a1a1aa; }
        </style>
        <!-- Topbar Placeholder -->
        <div id="layout-topbar" data-title="Activation History"></div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 md:p-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-100 to-gray-50 dark:from-dark-800 dark:to-dark-900">
            
            <div class="max-w-6xl mx-auto w-full">
                
                <!-- Page Title -->
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between">
                    <h4 class="text-xl font-bold text-gray-900 dark:text-white mb-2 sm:mb-0">Activation History</h4>
                    <nav class="flex" aria-label="Breadcrumb">
                        <ol class="inline-flex items-center space-x-1 md:space-x-3">
                            <li class="inline-flex items-center">
                                <span class="text-sm font-medium text-gray-500 dark:text-zinc-400">Tools</span>
                            </li>
                            <li>
                                <div class="flex items-center">
                                    <svg class="w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/></svg>
                                    <span class="text-sm font-medium text-gray-700 dark:text-zinc-200 ml-1 md:ml-2">History</span>
                                </div>
                            </li>
                        </ol>
                    </nav>
                </div>

                <!-- Data Table Panel -->
                <div class="bg-white/80 dark:bg-dark-800/80 backdrop-blur-md rounded-2xl p-6 border border-gray-200 dark:border-white/10 shadow-lg">
                    
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white mb-1">
                            Activation Logs
                        </h1>
                        <p class="text-gray-500 dark:text-zinc-400 text-sm">View history of generated licenses.</p>
                    </div>

                    <!-- Data Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-gray-500 dark:text-gray-400" id="historyTable">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-dark-900/50 dark:text-gray-400 border-b border-gray-200 dark:border-white/10 text-center">
                                <tr>
                                    <th scope="col" class="px-4 py-3 rounded-tl-lg whitespace-nowrap">Date</th>
                                    <th scope="col" class="px-4 py-3 whitespace-nowrap">Hardware ID</th>
                                    <th scope="col" class="px-4 py-3 whitespace-nowrap">Expiry Date</th>
                                    <th scope="col" class="px-4 py-3 rounded-tr-lg whitespace-nowrap">Generated Key</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- Loading state -->
                                <tr>
                                    <td colspan="4" class="px-6 py-8 text-center text-gray-500 dark:text-zinc-500">
                                        <svg class="w-6 h-6 animate-spin mx-auto mb-2 text-accent-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                        Loading data...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

                <!-- Footer Placeholder -->
                <div id="layout-footer"></div>
            </div>
        </div>
    </main>

    <script src="assets/js/layout.js"></script>
    <script>
        (async function loadHistory() {
            const tbody = document.getElementById('historyTableBody');
            try {
                const res = await fetch('/api/history');
                const result = await res.json();
                
                if (result.error) throw new Error(result.error);
                
                if (!result.data || result.data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-gray-500 dark:text-zinc-500 border-b border-gray-200 dark:border-white/5">
                                No activation records found.
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = '';
                result.data.forEach(item => {
                    let dateStr = item.created_at;
                    // Supabase timestamp without timezone needs 'Z' to be parsed correctly as UTC
                    if (!dateStr.endsWith('Z') && !dateStr.includes('+')) {
                        dateStr += 'Z';
                    }
                    const dateObj = new Date(dateStr);
                    const formattedDate = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    const tr = document.createElement('tr');
                    tr.className = 'bg-white dark:bg-transparent border-b border-gray-200 dark:border-white/5 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors';
                    tr.innerHTML = `
                        <td class="px-4 py-4 text-center font-medium text-gray-900 dark:text-white whitespace-nowrap">
                            ${formattedDate}
                        </td>
                        <td class="px-4 py-4 text-center font-mono text-xs">
                            ${item.mb}
                        </td>
                        <td class="px-4 py-4 text-center">
                            ${item.expiry_date}
                        </td>
                        <td class="px-4 py-4 text-justify font-mono text-xs text-gray-400 break-all">
                            ${item.passkey}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                
                // Initialize DataTable
                if (window.historyDataTable) {
                    window.historyDataTable.destroy();
                }
                window.historyDataTable = new simpleDatatables.DataTable("#historyTable", {
                    searchable: true,
                    fixedHeight: false,
                    perPage: 10,
                    classes: {
                        active: "bg-accent-500",
                        paginationList: "flex gap-1 items-center justify-end mt-4"
                    }
                });
            } catch (err) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-6 py-8 text-center text-red-500 border-b border-gray-200 dark:border-white/5">
                            Failed to load history: ${err.message}
                        </td>
                    </tr>
                `;
            }
        })();
    </script>
</body>
</html>
